<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 50" width="240" height="50" role="img" aria-label="Odskoč si logo">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Overpass:wght@900&amp;display=swap');
      .logo-text {
        font-family: 'Overpass', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-weight: 900;
        letter-spacing: -0.5px;
      }
    </style>
  </defs>
  <!-- Yellow dot accent / indicator -->
  <rect x="0" y="8" width="8" height="34" rx="4" fill="#F5B700" />
  <!-- Main negative wordmark -->
  <text x="20" y="37" class="logo-text" font-size="34" fill="#FFFFFF">Odskoč</text>
  <text x="160" y="37" class="logo-text" font-size="34" fill="#F5B700">si</text>
</svg>
